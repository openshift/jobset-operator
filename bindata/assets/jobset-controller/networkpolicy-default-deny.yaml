# Default-deny policy for the openshift-jobset-operator namespace.
# NetworkPolicies are additive: this policy enables default-deny for all pods,
# and subsequent policies add specific allow rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openshift-jobset-operator
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
