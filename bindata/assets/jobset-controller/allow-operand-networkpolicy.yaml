# Allow network traffic for the jobset-controller-manager operand pods:
# - Ingress: admission webhook (9443) and metrics scrape (8443)
# - Egress: all (for DNS, API server, and other outbound traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobset-allow-operand
  namespace: openshift-jobset-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jobset
      control-plane: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook port 9443 is open to traffic from all namespaces (no "from" restriction).
    # The kube-apiserver calls this webhook over hostNetwork and cannot be matched
    # by namespace or pod selectors. Since AdminNetworkPolicy also doesn't support
    # the "nodes" peer, there is no way to restrict ingress to only hostNetwork
    # traffic on this port. TLS on the endpoint provides authentication.
    # The Service exposes port 443 -> targetPort 9443 on the pod. NetworkPolicy
    # operates on pod ports, and OVN-Kubernetes does not support named ports,
    # so we use the numeric port 9443 directly.
    - ports:
        - protocol: TCP
          port: 9443
    # Allow metrics from OpenShift monitoring namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              openshift.io/cluster-monitoring: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow all egress for DNS, API server, etc.
    # API address and port are not known at manifest time.
    - {}
