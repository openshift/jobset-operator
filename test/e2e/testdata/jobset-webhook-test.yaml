apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: netpol-e2e-webhook-
  namespace: default
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: sleep
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "10"]
