# Default deny all ingress and egress for all pods in the namespace.
# Numbered after allow policies so oc apply -f (alphabetical) applies
# allows first, preventing a race where deny is active before allows exist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobset-default-deny
  namespace: openshift-jobset-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
